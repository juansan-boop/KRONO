<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Notificaciones y Alarmas - KRONO</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          colors: {
            background: '#0B0B12',
            surface: '#13131A',
            'surface-container': '#1F1F26',
            'surface-card': '#161622',
            'surface-input': '#1B1B26',
            'accent-purple': '#A200FF',
            'accent-cyan': '#00E5FF',
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: #0B0B12;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-background text-white h-screen max-h-screen w-full flex flex-col justify-between px-5 py-6 select-none max-w-[430px] mx-auto box-border overflow-hidden">
<!-- Top Container: Header & Core Settings -->
<div class="w-full flex flex-col gap-6">
<!-- Header & Back Button -->
<header class="w-full pt-1">
<div class="flex items-center justify-between">
<button class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-input/80 border border-white/10 text-xs font-medium text-gray-300 hover:text-white hover:border-white/20 transition-all active:scale-95" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Volver al Perfil</span>
</button>
<span class="text-[11px] font-semibold text-gray-500 uppercase tracking-widest">Ajustes</span>
</div>
<div class="mt-5">
<h1 class="text-2xl font-bold text-white tracking-tight">Notificaciones y Alarmas</h1>
<p class="text-xs text-gray-400 mt-1">Configura recordatorios y avisos esenciales para tu jornada.</p>
</div>
</header>
<!-- Main Settings: Recordatorios de Tareas -->
<main class="w-full flex flex-col gap-3">
<h2 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-1">Recordatorios de Tareas</h2>
<div class="bg-surface rounded-2xl p-4 border border-white/5 flex flex-col gap-4 shadow-sm">
<!-- Item 1: Avisos de entrega -->
<div class="flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-surface-input flex items-center justify-center text-purple-400 border border-white/5 shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-sm font-medium text-white">Avisos de entrega</p>
<p class="text-xs text-gray-400">Notificar 30 min antes del plazo</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer shrink-0">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-input peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#A200FF] peer-checked:shadow-[0_0_12px_rgba(162,0,255,0.45)] border border-white/10"></div>
</label>
</div>
<div class="h-px bg-white/5 w-full"></div>
<!-- Item 2: Alarma Sonora -->
<div class="flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-surface-input flex items-center justify-center text-purple-400 border border-white/5 shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-sm font-medium text-white">Alarma sonora de inicio</p>
<p class="text-xs text-gray-400">Tono discreto al empezar bloque</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer shrink-0">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-input peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#A200FF] peer-checked:shadow-[0_0_12px_rgba(162,0,255,0.45)] border border-white/10"></div>
</label>
</div>
</div>
</main>
</div>
<!-- Bottom CTA Actions -->
<footer class="w-full pt-4 pb-2 flex flex-col gap-2.5">
<button class="w-full py-3.5 px-4 rounded-xl bg-[#A200FF] text-white text-sm font-semibold hover:bg-opacity-90 active:scale-[0.99] transition-all shadow-[0_0_20px_rgba(162,0,255,0.35)] flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Guardar Preferencias</span>
</button>
<button class="w-full py-2 text-center text-xs font-medium text-gray-400 hover:text-gray-200 transition-colors" type="button">
      Restablecer valores predeterminados
    </button>
</footer>


</body></html>
