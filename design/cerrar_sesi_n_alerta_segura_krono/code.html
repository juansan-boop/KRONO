<!DOCTYPE html><html class="dark" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Cerrar Sesión - Alerta Segura | KRONO AI</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration for Cyber-Lumina Aesthetics -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            krono: {
              bg: '#08090f',
              card: '#121422',
              border: '#1f2438',
              cyan: '#06b6d4',
              emerald: '#10b981',
              magenta: '#d946ef',
              fuchsia: '#c026d3',
              crimson: '#ef4444',
            }
          }
        }
      }
    }
  </script>
<!-- Custom CSS for Cyberpunk Ambient Glow and Backdrops -->
<style data-purpose="ambient-effects">
    .cyber-glow-magenta {
      background: radial-gradient(circle at 50% 20%, rgba(217, 70, 239, 0.12) 0%, transparent 65%);
    }
    .cyber-glow-cyan {
      background: radial-gradient(circle at 50% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
    }
    .icon-halo-danger {
      box-shadow: 0 0 35px -5px rgba(239, 68, 68, 0.28), 0 0 15px -3px rgba(217, 70, 239, 0.2);
    }
    .lumina-card {
      background: linear-gradient(180deg, rgba(24, 27, 43, 0.82) 0%, rgba(14, 16, 27, 0.94) 100%);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .primary-lumina-btn {
      background: linear-gradient(135deg, #f0abfc 0%, #e879f9 50%, #c026d3 100%);
      box-shadow: 0 0 25px -4px rgba(217, 70, 239, 0.45);
    }
  </style>
</head>
<body class="bg-[#08090f] text-slate-100 font-sans min-h-screen antialiased flex justify-center items-center overflow-x-hidden selection:bg-fuchsia-500 selection:text-white">
<!-- Mobile Viewport Simulator Container (393px typical iOS width frame) -->
<main class="w-full max-w-[412px] min-h-screen bg-[#08090f] relative flex flex-col justify-between overflow-hidden px-5 py-4 border-x border-slate-900/60 shadow-2xl">
<!-- Ambient Dynamic Light Halos -->
<div class="absolute inset-0 cyber-glow-magenta pointer-events-none z-0"></div>
<div class="absolute inset-0 cyber-glow-cyan pointer-events-none z-0"></div>
<!-- BEGIN: TopStatusBarAndHeader -->
<header class="relative z-10 w-full pt-1">
<!-- iOS-style Status Bar indicator mock -->

<!-- Navigation & Security Pill Bar -->
<div class="flex items-center justify-between mt-1">
<!-- Back Button -->
<button aria-label="Volver al Perfil de Usuario" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 hover:border-slate-700 active:scale-95 transition-all text-xs font-semibold text-slate-300" type="button">
<svg class="w-3.5 h-3.5 text-fuchsia-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="">Volver al Perfil</span>
</button>
<!-- Security Badge -->

</div>
</header>
<!-- END: TopStatusBarAndHeader -->
<!-- BEGIN: SecurityConfirmationModal -->
<section aria-labelledby="modal-title" class="relative z-10 my-auto py-4">
<!-- Lumina Glass Modal Container Card -->
<div class="lumina-card backdrop-blur-xl rounded-[28px] p-6 border border-white/10 text-center relative overflow-hidden">
<!-- Subtle Neon Rim Highlight (Top) -->
<div class="absolute top-0 inset-x-8 h-px bg-gradient-to-r from-transparent via-rose-500/50 to-transparent"></div>
<!-- Warning / Security Log Out Halo Icon -->
<div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-b from-rose-950/80 to-slate-900 border border-rose-500/30 flex items-center justify-center icon-halo-danger mb-5 transform transition-transform duration-300">
<svg class="w-8 h-8 text-rose-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Modal Main Heading -->
<h1 class="text-2xl font-bold tracking-tight text-white mb-2.5 font-sans" id="modal-title">
          ¿Cerrar sesión de KRONO?
        </h1>
<!-- Explanatory Copy -->
<p class="text-[13px] leading-relaxed text-slate-400 px-1 mb-6 font-normal">
          Tus tareas y sesiones de concentración locales se sincronizarán en la nube antes de desconectar este dispositivo. Podrás volver a ingresar en cualquier momento.
        </p>
<!-- Current User Status Mini-Card (Synchronized State Verification) -->
<div class="bg-slate-950/60 rounded-2xl p-3.5 border border-slate-800/80 mb-6 text-left" data-purpose="user-sync-status-card">
<div class="flex items-center justify-between mb-1.5">
<div class="flex items-center gap-2 min-w-0">
<div class="w-7 h-7 rounded-lg bg-fuchsia-950/80 border border-fuchsia-500/40 flex items-center justify-center flex-shrink-0">
<span class="text-xs font-bold text-fuchsia-300">AG</span>
</div>
<div class="truncate">
<p class="text-xs font-bold text-slate-200 leading-tight truncate">Alexa Gómez</p>
<p class="text-[11px] text-slate-400 font-mono truncate">alexa.gomez@correo.com</p>
</div>
</div>
<!-- Cloud Connected Badge -->

</div>
<div class="mt-2.5 pt-2.5 border-t border-slate-900 flex items-center justify-between text-[11px] font-mono text-slate-400">

<span class="text-slate-500">100% al día</span>
</div>
</div>
<!-- Security Checkbox Preference -->

<!-- Modal Action Buttons Stack -->
<div class="space-y-2.5" data-purpose="action-buttons">
<!-- Primary: Stay in App (Safe Action) -->
<button class="w-full py-3.5 px-4 rounded-2xl primary-lumina-btn text-slate-950 font-bold text-sm tracking-wide transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Permanecer en KRONO</span>
</button>
<!-- Danger: Confirm Logout -->
<button class="w-full py-3.5 px-4 rounded-2xl bg-rose-950/20 hover:bg-rose-950/40 border border-rose-800/40 hover:border-rose-600/60 text-rose-300 font-semibold text-sm transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Cerrar Sesión</span>
</button>
</div>
</div>
</section>
<!-- END: SecurityConfirmationModal -->
<!-- BEGIN: SystemFooter -->
<footer class="relative z-10 pb-4 text-center">
<div class="flex items-center justify-center gap-2 text-[11px] font-mono text-slate-500 tracking-tight">
<span class="w-1.5 h-1.5 rounded-full bg-cyan-400/80"></span>
<p class="">KRONO AI Engine v2.4.0 • Conexión cifrada E2E</p>
</div>
<!-- iOS Bottom Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-800 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: SystemFooter -->
</main>


</body></html>
