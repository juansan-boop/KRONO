<!DOCTYPE html><html class="dark" lang="es" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">

                "tertiary-container": "#e7006e",
                "on-secondary-fixed": "#002022",
                "surface-container-lowest": "#0d0d1c",
                "inverse-surface": "#e3e0f6",
                "secondary-container": "#00b7c3",
                "outline-variant": "#514255",
                "background": "#121221",
                "on-surface": "#e3e0f6",
                "on-tertiary-fixed": "#3f0019",
                "tertiary": "#ffb1c3",
                "on-primary-container": "#ffffff",
                "on-error": "#690005",
                "surface": "#121221",
                "outline": "#9d8ba0",
                "tertiary-fixed": "#ffd9e0",
                "primary-fixed-dim": "#ecb2ff",
                "secondary": "#49d9e5",
                "error-container": "#93000a",
                "on-tertiary-container": "#ffffff",
                "on-surface-variant": "#d4c0d7",
                "on-error-container": "#ffdad6",
                "surface-container-highest": "#343344",
                "surface-container-low": "#1a1a2a",
                "inverse-primary": "#9900cf",
                "on-secondary-container": "#004347",
                "surface-bright": "#383848",
                "secondary-fixed-dim": "#49d9e5",
                "surface-variant": "#343344",
                "on-primary-fixed-variant": "#74009f",
                "on-primary-fixed": "#320047",
                "inverse-on-surface": "#2f2f3f",
                "on-background": "#e3e0f6",
                "primary": "#ecb2ff",
                "on-secondary": "#00363b",
                "surface-dim": "#121221"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "gutter": "16px",
                "container-padding": "24px",
                "card-gap": "20px",
                "base": "8px"
        },
        "fontFamily": {
                "headline-lg-mobile": [
                        "Hanken Grotesk"
                ],
                "label-sm": [
                        "JetBrains Mono"
                ],
                "display-lg": [
                        "Hanken Grotesk"
                ],
                "body-md": [
                        "Hanken Grotesk"
                ],
                "headline-lg": [
                        "Hanken Grotesk"
                ]
        },
        "fontSize": {
                "headline-lg-mobile": [
                        "24px",
                        {
                                "lineHeight": "32px",
                                "fontWeight": "600"
                        }
                ],
                "label-sm": [
                        "12px",
                        {
                                "lineHeight": "16px",
                                "letterSpacing": "0.05em",
                                "fontWeight": "500"
                        }
                ],
                "display-lg": [
                        "48px",
                        {
                                "lineHeight": "56px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                        }
                ],
                "body-md": [
                        "16px",
                        {

                                "fontWeight": "400"

                ],
                "headline-lg": [
                        "32px",
                        {
                                "lineHeight": "40px",
                                "fontWeight": "600"
                        }
                ]
        }
},
    },
  }
</script></head><body class="bg-background text-on-surface font-body-md"><main class="min-h-screen pt-safe pb-safe"><div class="flex flex-col w-full min-h-screen bg-gradient-to-b from-background to-surface-container-lowest text-on-background relative overflow-hidden items-center justify-center p-6">
<!-- Animated Background Elements (Glassmorphism Level 0) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-secondary-container opacity-5 blur-[100px] animate-[pulse_8s_ease-in-out_infinite]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-primary-container opacity-10 blur-[100px] animate-[pulse_10s_ease-in-out_infinite_alternate]"></div>
</div>
<div class="w-full max-w-md z-10 flex flex-col items-center">
<!-- Logo -->
<div class="mb-12 flex flex-col items-center">
<div class="w-16 h-16 rounded-2xl overflow-hidden mb-6 bg-surface-container-low/40 shadow-lg flex items-center justify-center relative backdrop-blur-md" style="border: 1px solid rgba(189, 0, 255, 0.2);">
<!-- Glass reflection -->
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
<img alt="KRONO Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WonWgIQtB4sj-OzJLy_Y3-IXgy6fvUOQGCywUOLJCKJXt3YFtyiROHa1VaEamZH3m5VKvM7ezsO_NyQJv8vwZGt3VivE2iLZUDW1MaN2R6P0W6LUbBfdORgxwBfveJjoE61n-Id5ANsuLZrNAl513qyuvL7IKwIU4fK5Eb6NUNR3GDYa3-r_7IvIB4rUEWZX97woRE2WxMIXjMwF-wHX3AmP3HKFMChOP6vg2EGsUtBlOsA8VABMryMds">
</div>
<h1 class="text-headline-lg text-on-surface text-center mb-2">¿Olvidaste tu contraseña?</h1>
<p class="text-body-md text-on-surface-variant text-center max-w-[320px]">
        Ingresa tu correo electrónico registrado y te enviaremos un enlace seguro para restablecerla.
      </p>
</div>
<!-- Central Card (Glass Module) -->
<div class="w-full bg-surface-container-low/30 backdrop-blur-[24px] rounded-2xl p-container-padding shadow-xl relative isolate transition-all duration-300" style="border: 1px solid rgba(189, 0, 255, 0.15);">
<!-- Glow effect behind card -->
<div class="absolute inset-0 bg-gradient-to-b from-primary-container/5 to-transparent rounded-2xl -z-10 pointer-events-none"></div>
<form class="flex flex-col gap-5" id="forgot-password-form">
<!-- Input Field -->
<div class="flex flex-col gap-2">
<label class="text-label-sm uppercase ml-1 text-error" for="email">Correo electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant group-focus-within:text-primary-container transition-colors duration-200">mail</span>
</div>
<input class="w-full bg-surface-container/40 text-on-surface placeholder:text-outline-variant rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:ring-1 focus:ring-primary-container focus:bg-surface-container/60 transition-all duration-200 text-body-md backdrop-blur-sm" id="email" placeholder="ejemplo@correo.com" required="" style="border: 1px solid #ff4d4d;" type="email">
<!-- Glowing border effect on focus -->
<div class="absolute inset-0 rounded-xl opacity-0 group-focus-within:opacity-100 pointer-events-none transition-opacity duration-300 shadow-[0_0_15px_rgba(189,0,255,0.1)]"></div>
</div><div class="mt-2 flex items-center gap-2 text-error animate-in fade-in slide-in-from-top-1 duration-200"><span class="material-symbols-outlined text-sm">error</span><span class="text-label-sm">Este correo no está registrado en KRONO</span></div>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 bg-primary-container text-on-primary-container py-4 rounded-xl font-body-md font-semibold tracking-wide flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-lg relative overflow-hidden group border border-primary-container/20" type="submit">
<span class="relative z-10">Enviar enlace de recuperación</span>
<!-- Soft glowing overlay -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-0"></div>
<span class="material-symbols-outlined relative z-10 text-sm">arrow_forward</span>
</button>
</form>
<!-- Success Feedback (Hidden by default) -->
<div class="mt-6 bg-surface-container/40 text-secondary-container rounded-xl p-4 flex items-start gap-3 transform opacity-0 transition-all duration-300 origin-top hidden backdrop-blur-md" id="success-message" style="border: 1px solid rgba(0, 183, 195, 0.2);">
<span class="material-symbols-outlined text-secondary-container shrink-0" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="text-label-sm leading-relaxed pt-0.5 text-on-surface">
          ¡Enlace enviado! Revisa tu bandeja de entrada o la carpeta de spam.
        </p>
</div>
</div>
<!-- Secondary Link -->
<a class="mt-8 text-body-md hover:text-primary-container flex items-center gap-2 transition-colors duration-200 group" href="#"><span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform duration-200 text-primary-container">arrow_back</span><span class="text-primary-container">Volver a Iniciar Sesión</span></a>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('forgot-password-form');
    const successMessage = document.getElementById('success-message');
    const emailInput = document.getElementById('email');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if(emailInput.value) {
        // Simulate network request
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span>';
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

        setTimeout(() => {
          // Reset button
          submitBtn.innerHTML = '<span class="relative z-10">Enviar enlace de recuperación</span><span class="material-symbols-outlined relative z-10 text-sm">arrow_forward</span>';
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
          
          // Show success message
          successMessage.classList.remove('hidden');
          // Trigger reflow
          void successMessage.offsetWidth;
          
          successMessage.classList.remove('scale-95', 'opacity-0');
          successMessage.classList.add('scale-100', 'opacity-100');
          
          // Optional: clear input
          emailInput.value = '';
          
          // Hide success message after 5 seconds
          setTimeout(() => {
            successMessage.classList.remove('scale-100', 'opacity-100');
            successMessage.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
              successMessage.classList.add('hidden');
            }, 300);
          }, 5000);
        }, 1500);
      }
    });
  });
</script></main>
</body></html>
