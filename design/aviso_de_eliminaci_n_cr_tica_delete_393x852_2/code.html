<!DOCTYPE html><html lang="es" class="h-full"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aviso Gigante de Eliminación - DELETE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: #080812;
      color: #FFFFFF;
      overflow: hidden;
      width: 393px;
      height: 852px;
      margin: 0 auto;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="w-[393px] h-[852px] max-w-[393px] max-h-[852px] bg-[#080812] relative overflow-hidden select-none">

  <!-- CAPA DE FONDO: Pantalla de Ajustes simulada desenfocada y oscurecida al 85% -->
  <div class="absolute inset-0 w-full h-full filter blur-[10px] opacity-25 pointer-events-none p-5 flex flex-col justify-between">
    <div class="h-10 flex justify-between items-center border-b border-white/20">
      <div class="h-5 w-24 bg-white/40 rounded"></div>
      <div class="h-5 w-16 bg-[#49D9E5]/40 rounded-full"></div>
    </div>
    <div class="space-y-4 my-auto">
      <div class="h-28 bg-[#161522] rounded-[16px] border border-white/10"></div>
      <div class="h-20 bg-[#161522] rounded-[16px] border border-white/10"></div>
      <div class="h-28 bg-[#161522] rounded-[16px] border border-white/10"></div>
    </div>
    <div class="h-14 bg-[#0E0D17] rounded-t-lg"></div>
  </div>

  <!-- OVERLAY OSCURO AL 85% CON DESENFOQUE -->
  <div class="absolute inset-0 bg-[#080812]/85 backdrop-blur-md"></div>

  <!-- Status Bar Nativa -->
  <div class="relative h-11 px-7 pt-3 flex items-center justify-between text-xs text-[#8B8B9E] font-medium z-10">
    <span class="font-mono-tech text-[13px] tracking-tight text-neutral-300 font-semibold">09:41</span>
    <div class="flex items-center space-x-2 text-[12px]">
      <svg class="w-3.5 h-3.5 fill-current text-neutral-300" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.73-.73C8.03 20.19 9.93 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path></svg>
      <svg class="w-3.5 h-3.5 fill-current text-neutral-300" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
      <div class="w-5 h-2.5 border border-neutral-400 rounded-sm p-0.5 flex items-center">
        <div class="w-full h-full bg-[#49D9E5] rounded-2xs"></div>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR MODAL CENTRAL DESTACADO (85% del ancho de la pantalla) -->
  <div class="relative z-20 h-[calc(852px-44px)] flex items-center justify-center px-6">
    <div class="w-[334px] max-w-[85%] bg-[#13121E] border-2 border-[#FF4D6D] rounded-[20px] p-5 shadow-[0_0_40px_rgba(255,77,109,0.3)] flex flex-col items-center text-center">

      <!-- Ícono Gigante Superior con círculo rojo tenue y símbolo rojo brillante -->
      <div class="w-16 h-16 rounded-full bg-[#35121B] border border-[#FF4D6D]/40 flex items-center justify-center text-[#FF4D6D] mb-3.5 shadow-[0_0_20px_rgba(255,77,109,0.25)]">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </div>

      <!-- Título Impactante Centrado -->
      <h2 class="text-[20px] font-extrabold text-white tracking-tight mb-2 leading-tight">¿ELIMINAR CUENTA Y DATOS LOCALES?</h2>

      <!-- Texto de Advertencia Claro (14sp, gris claro) -->
      <p class="text-[13.5px] text-[#C0BFD3] leading-relaxed mb-3.5 px-1 font-normal">Se cancelará tu perfil de forma definitiva y se purgarán todas tus tareas, telemetría y bloques sincronizados de la base de datos local.</p>

      <!-- Caja Técnica en JetBrains Mono (11sp, rojo tenue) -->
      <div class="w-full bg-[#201017] border border-[#FF4D6D]/30 rounded-[10px] py-2 px-3 mb-4">
        <p class="font-mono-tech text-[10.5px] font-semibold text-[#FF859B] tracking-tight">
          [!] ACCIÓN IRREVERSIBLE · ROOM DB PURGE
        </p>
      </div>

      <!-- Campo de Confirmación con la palabra "ELIMINAR" escrita -->
      <div class="w-full text-left mb-4">
        <label class="block font-mono-tech text-[10.5px] text-[#9E9CAC] mb-1.5 font-medium">Escribe ELIMINAR para autorizar la eliminación definitiva:</label>
        <div class="relative w-full">
          <input type="text" readonly="" value="ELIMINAR" class="w-full h-11 bg-[#090812] border border-[#FF4D6D]/70 rounded-[12px] px-3.5 font-mono-tech font-bold text-[14px] text-white tracking-widest focus:outline-none shadow-inner">
          <div class="absolute right-3 top-3 text-[#FF4D6D]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Botón Destructivo Grande -->
      <button class="w-full h-12 rounded-[14px] bg-[#FF4D6D] hover:bg-[#FF3358] active:scale-[0.99] text-white font-bold text-[14.5px] tracking-tight transition-all shadow-[0_0_20px_rgba(255,77,109,0.4)] mb-2.5">Confirmar y Eliminar Cuenta</button>

      <!-- Botón Cancelar y volver -->
      <button class="w-full py-1.5 text-[13px] font-medium text-[#A5A4B8] hover:text-white transition-colors">← Volver a opciones</button>

    </div>
  </div>





</body></html>
