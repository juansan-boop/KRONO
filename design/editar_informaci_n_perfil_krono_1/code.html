<!DOCTYPE html>

<html class="dark" lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;background-color:#13131a;color:#e4e1eb;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface": "#13131a", "surface-dim": "#13131a", "surface-container-lowest": "#0e0e15", "surface-container-low": "#1b1b22", "surface-container": "#1f1f26", "surface-container-high": "#2a2931", "surface-container-highest": "#34343c", "on-surface": "#e4e1eb", "on-surface-variant": "#d1c1d8", "primary": "#e1b6ff", "primary-container": "#a200ff", "on-primary": "#4c007c", "on-primary-container": "#f9e9ff", "secondary": "#c6c4d9", "secondary-container": "#484759", "tertiary": "#ffb77f", "outline": "#9a8ca1", "outline-variant": "#4e4256" }, fontFamily: { "headline-lg": ["Hanken Grotesk"], "headline-md": ["Hanken Grotesk"], "headline-sm": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"], "label-md": ["Hanken Grotesk"], "label-xs": ["Hanken Grotesk"] } } } }</script></head><body class="bg-surface font-['Hanken_Grotesk'] text-[#e4e1eb] min-h-screen flex flex-col selection:bg-primary selection:text-on-primary">
<div class="w-full max-w-md mx-auto min-h-screen flex flex-col justify-between p-6 pt-safe pb-safe box-border">
<!-- Header / Barra Superior -->
<header class="flex items-center justify-between py-2 mb-4">
<a class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high/80 border border-outline-variant/30 text-on-surface hover:bg-surface-container-highest transition-all duration-200 active:scale-95 text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[18px] text-primary">arrow_back</span>
<span>Volver al Perfil</span>
</a>
<h1 class="text-base font-semibold text-on-surface tracking-tight">Editar Información</h1>
<div class="w-8"></div>
</header>
<!-- Contenido Central -->
<main class="flex-1 flex flex-col justify-center gap-6 py-2">
<!-- Contenedor Avatar -->
<div class="flex flex-col items-center justify-center">
<div class="relative group cursor-pointer" id="avatarTrigger">
<div class="w-24 h-24 rounded-full overflow-hidden shadow-2xl border-2 border-primary/30 bg-surface-container-lowest relative">
<img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" data-alt="Foto de perfil de Alexa Gómez" id="profilePreviewImage" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNHKZbwu9ouA2EDf9fPUJA4xBhWuEAYhiMD6_cc7OhL-L0qCEddOX92RusxTfyWEpkoxgU63mUsQxOpVgOmUsRjsY0PlyAtAUmeRIX0jjlsb0Q4HI_ia8AQoYOTJ3YjwWBRGQPn-gUTbXMPTAjQ2GYEwpRxg8lsLsmnagaGYCigvvR5qhS8javrvuepI3y_psrXWifFqPwvazgdG-4biKJvs1rmk07uyi_clV1Ck8yhhi6P8Wxcrfq"/>
<div class="absolute inset-0 bg-surface-container-lowest/40 backdrop-blur-[1px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[28px]">photo_camera</span>
</div>
</div>
<button aria-label="Cambiar foto de perfil" class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#a200ff] text-white flex items-center justify-center shadow-lg active:scale-90 transition-transform border-2 border-surface" type="button">
<span class="material-symbols-outlined text-[17px]">photo_camera</span>
</button>
<input accept="image/*" class="hidden" id="fileUploadInput" type="file"/>
</div>
<p class="text-xs text-on-surface-variant mt-2 font-normal">Toca la cámara para actualizar foto</p>
</div>
<!-- Formulario con 3 campos solicitados -->
<form class="flex flex-col gap-4" id="editProfileForm" onsubmit="event.preventDefault();">
<!-- Campo 1: Nombre Completo -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant flex items-center gap-1.5" for="fullNameInput">
<span class="material-symbols-outlined text-[16px] text-primary">person</span>
          Nombre Completo
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low border border-outline-variant/30 text-on-surface text-sm focus:border-primary focus:bg-surface-container focus:outline-none transition-all placeholder:text-outline" id="fullNameInput" placeholder="Tu nombre completo" required="" type="text" value="Alexa Gómez"/>
<span class="material-symbols-outlined absolute right-3.5 text-secondary text-[20px] pointer-events-none" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Campo 2: Rol Académico / Profesional -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant flex items-center gap-1.5" for="roleSelector">
<span class="material-symbols-outlined text-[16px] text-primary">badge</span>
          Rol Académico / Profesional
        </label>
<div class="relative flex items-center">
<select class="w-full h-12 px-4 pr-10 rounded-xl bg-surface-container-low border border-outline-variant/30 text-on-surface text-sm appearance-none focus:border-primary focus:bg-surface-container focus:outline-none transition-all cursor-pointer" id="roleSelector">
<option class="bg-surface-container-low text-on-surface" selected="" value="dual">Estudiante y Trabajadora</option>
<option class="bg-surface-container-low text-on-surface" value="student">Estudiante Tiempo Completo</option>
<option class="bg-surface-container-low text-on-surface" value="professional">Profesional Técnico</option>
<option class="bg-surface-container-low text-on-surface" value="research">Investigadora &amp; Operadora</option>
</select>
<span class="material-symbols-outlined absolute right-3.5 text-on-surface-variant pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
<!-- Campo 3: Correo electrónico / Contacto -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface-variant flex items-center gap-1.5" for="emailInput">
<span class="material-symbols-outlined text-[16px] text-primary">alternate_email</span>
          Correo electrónico / Contacto
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low border border-outline-variant/30 text-on-surface text-sm focus:border-primary focus:bg-surface-container focus:outline-none transition-all placeholder:text-outline" id="emailInput" placeholder="tu.correo@dominio.com" required="" type="email" value="alexa.gomez@correo.com"/>
<span class="material-symbols-outlined absolute right-3.5 text-outline text-[18px]">lock</span>
</div>
</div>
</form>
</main>
<!-- Botones de Acción al Final -->
<footer class="flex flex-col gap-2.5 pt-4">
<button class="w-full h-12 rounded-xl bg-[#a200ff] text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(162,0,255,0.35)] active:scale-[0.98] transition-all hover:brightness-110" id="saveBtn" type="button">
<span class="material-symbols-outlined text-[20px]">save</span>
<span>Guardar Cambios</span>
</button>
<button class="w-full h-11 rounded-xl bg-transparent text-on-surface-variant hover:text-on-surface text-sm font-medium flex items-center justify-center transition-colors active:scale-95" id="cancelBtn" type="button">
      Cancelar
    </button>
</footer>
<!-- Toast Notification -->
<div class="fixed bottom-6 left-6 right-6 z-50 transform translate-y-24 opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-between p-3.5 rounded-xl bg-surface-container-highest border border-primary/20 text-on-surface shadow-2xl max-w-sm mx-auto" id="toastNotification">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-primary text-[20px]">check_circle</span>
<span class="text-xs font-medium" id="toastMessage">Cambios actualizados exitosamente</span>
</div>
<span class="text-[10px] text-primary font-bold tracking-wider uppercase">OK</span>
</div>
</div>
<script>
  (function() {
    const avatarTrigger = document.getElementById('avatarTrigger');
    const fileInput = document.getElementById('fileUploadInput');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMessage');

    if (avatarTrigger && fileInput) {
      avatarTrigger.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const preview = document.getElementById('profilePreviewImage');
            if (preview) preview.src = ev.target.result;
          };
          reader.readAsDataURL(e.target.files[0]);
          showToast('Nueva fotografía lista para guardar');
        }
      });
    }

    function showToast(text) {
      if (!toast) return;
      if (text && toastMsg) toastMsg.textContent = text;
      toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.disabled = true;
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Guardando...</span>';
        setTimeout(() => {
          saveBtn.innerHTML = originalText;
          saveBtn.disabled = false;
          showToast('Perfil actualizado correctamente');
        }, 500);
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        showToast('Edición cancelada');
      });
    }
  })();
</script>
</body></html>
