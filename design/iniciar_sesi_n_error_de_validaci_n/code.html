</script></head><body class="bg-surface font-body-md text-on-background flex items-center justify-center min-h-screen p-4" data-mode="connect">
<div class="relative w-full max-w-[375px] h-[812px] bg-background rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] border-[8px] border-surface-container overflow-hidden flex flex-col">
<header class="absolute top-0 inset-x-0 z-50 bg-background/50 backdrop-blur-xl pt-safe border-b border-white/5"><div class="h-16 px-container-margin flex items-center gap-stack-md"><button aria-label="Volver atrás" class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors backdrop-blur-md" onclick="history.back()"></button><div class="flex items-center gap-unit"></div></div></header><main class="flex flex-col relative w-full pt-16 bg-background px-container-margin flex-1" style="overflow-y: auto;"><div class="flex flex-col w-full items-center justify-center px-6 py-8 relative">
<!-- Glass decorative blur elements -->
<div class="absolute top-1/4 left-0 w-40 h-40 bg-primary/20 rounded-full blur-[60px] -z-10"></div>
<div class="absolute bottom-1/4 right-0 w-40 h-40 bg-primary/10 rounded-full blur-[60px] -z-10"></div>
<div class="w-full max-w-sm flex flex-col items-center animate-fade-in-up">
<!-- Logo -->
<div class="mb-6 flex justify-center w-full">
<img alt="KRONO Logo" class="h-20 w-20 object-contain drop-shadow-xl rounded-2xl ring-1 ring-white/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdAkx_lxY6QJvm1RpDWU2R8BXR5sJyCVdWwZ40hCTPkYT6imJe0GIyQ06w-pGDRHi2oCiomwU2y3rzdGImFk2eawZsT-c1T_FPnrTeUX1RjMtD_lFAc1dQdpIRbHLG1PjG-vYaRR3jI-700dlNp_fUb9OPyfwX6VsjyN74ARUuhoxb2xn15u7_-L3MVGu65Su9wNldp0OQtuQC6GYWlD1vaWCM9J3qJc964_m_r7uSvphMg9CTjDQj6m37dIK1XAw8_w">
</div>
<!-- Greeting -->
<div class="text-center w-full space-y-2 mb-8">
<h2 class="font-headline-lg-mobile text-[28px] font-semibold text-on-surface">Bienvenido de vuelta</h2>
<p class="font-body-md text-on-surface-variant">Accede a tu espacio de tranquilidad.</p>
</div>
<!-- Error Message Container -->
<div aria-live="polite" class="w-full text-center mb-4" id="form-error"><p class="text-error font-body-md text-[14px]">Correo electronico o contraseña incorrectos</p></div>
<!-- Form -->
<form class="w-full flex flex-col gap-5 mt-4" id="login-form" novalidate="" onsubmit="return handleLogin(event);">
<!-- Email Input -->
<div class="relative w-full group">
<input aria-describedby="email-error" class="peer w-full h-14 bg-surface-container-low backdrop-blur-md rounded-lg border border-outline/50 focus:border-2 focus:border-primary focus:outline-none text-on-surface px-4 transition-all placeholder-transparent shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] border-error" id="email" placeholder=" " required="" type="email">
<label class="absolute left-3 -top-2.5 bg-background px-1 text-on-surface-variant font-body-md text-[12px] transition-all peer-placeholder-shown:text-body-md peer-placeholder-shown:top-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-[12px] peer-focus:bg-background peer-focus:text-primary pointer-events-none rounded" for="email">
                    Correo electrónico
                </label>
</div>
<!-- Password Input -->
<div class="relative w-full group">
<input aria-describedby="password-error" class="peer w-full h-14 bg-surface-container-low backdrop-blur-md rounded-lg border border-outline/50 focus:border-2 focus:border-primary focus:outline-none text-on-surface px-4 transition-all placeholder-transparent shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] border-error" id="password" placeholder="Contraseña" required="" type="password">

                    Contraseña
                </label>

<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>

</div>

<span class="" id="btn-text">Iniciar Sesión</span>
<span class="material-symbols-outlined text-[18px]" id="btn-icon">arrow_forward</span>
<span class="material-symbols-outlined text-[18px] hidden animate-spin" id="btn-loading">progress_activity</span>
</button>
</form>
<!-- Sign Up Link -->
<div class="mt-10 w-full text-center mb-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes una cuenta? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors ml-1 font-semibold drop-shadow-[0_0_8px_rgba(189,0,255,0.3)]" href="#">Crear una cuenta</a>
</p>
</div>
</div>
</div>
<script>
    function handleLogin(event) {
        event.preventDefault();
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorContainer = document.getElementById('form-error');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnLoading = document.getElementById('btn-loading');
        
        let isValid = true;
        
        // Reset styles
        emailInput.classList.remove('border-error');
        passwordInput.classList.remove('border-error');
        errorContainer.classList.add('hidden');
        
        // Validate
        if (!emailInput.value.trim()) {
            emailInput.classList.add('border-error');
            isValid = false;
        }
        
        if (!passwordInput.value.trim()) {
            passwordInput.classList.add('border-error');
            isValid = false;
        }
        
        if (!isValid) {
            errorContainer.classList.remove('hidden');
            return false;
        }
        
        // Simulate loading
        submitBtn.disabled = true;
        btnText.innerText = 'Iniciando...';
        btnIcon.classList.add('hidden');
        btnLoading.classList.remove('hidden');
        submitBtn.classList.add('opacity-70');
        
        setTimeout(() => {
            // Reset state (in reality this would navigate)
            submitBtn.disabled = false;
            btnText.innerText = 'Iniciar Sesión';
            btnIcon.classList.remove('hidden');
            btnLoading.classList.add('hidden');
            submitBtn.classList.remove('opacity-70');
            console.log('Login successful');
            // window.location.href = '/dashboard';
        }, 1500);
        
        return false;
    }
</script>
<style>
    .border-error {

        from {
            opacity: 0;
            transform: translateY(16px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
