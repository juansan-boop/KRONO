<script>
  document.querySelectorAll('form button[type="button"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    });
  });

  const form = document.querySelector('form');
  const submitBtn = document.querySelector('button.bg-primary');
  const passInput = form.querySelectorAll('input[type="password"]')[0];
  const confirmInput = form.querySelectorAll('input[type="password"]')[1];
  const errorMsg = form.querySelector('.animate-\\[slideDown_0.2s_ease-out\\]');
  const confirmWrapper = confirmInput.parentElement;

  submitBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const passwordsMatch = passInput.value === confirmInput.value && passInput.value !== '';
    
    if (!passwordsMatch) {
      confirmWrapper.classList.add('bg-error-container/10', 'border-error/50');
      confirmWrapper.classList.remove('border-outline-variant/30');
      confirmWrapper.querySelector('div:last-child').classList.add('bg-error', 'h-[2px]');
      confirmWrapper.querySelector('div:last-child').classList.remove('bg-transparent', 'h-[1px]');
      errorMsg.style.display = 'flex';
    } else {
      // Simulate navigation
      console.log('Navigating to Profile Setup...');
      window.location.href = '#profile-setup';
    }
  });
</script>
