</div></div>
<!-- Estimación Rápida Inteligente (Detalle de deleite para estudiantes con empleo) -->

<div class="px-3 py-2 rounded-xl flex items-center justify-between gap-2 transition-all" style="background-color: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Poppins, sans-serif;">

</div>
